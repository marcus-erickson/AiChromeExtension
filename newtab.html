<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Command Deck</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="icons/icon16.png">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Dot grid background -->
  <div class="dot-grid"></div>

  <!-- Scan line overlay -->
  <div class="scanlines"></div>

  <!-- Floating glitch particles -->
  <canvas id="particle-canvas"></canvas>

  <div class="container">
    <!-- Clock display -->
    <div class="clock-panel">
      <div class="clock-frame">
        <span class="bracket bracket-left">[</span>
        <div class="clock-inner">
          <div id="current-time" class="current-time"></div>
          <div id="current-date" class="current-date"></div>
        </div>
        <span class="bracket bracket-right">]</span>
        <div class="clock-pulse"></div>
      </div>
    </div>

    <!-- Main heading -->
    <h1 class="title">
      <span class="title-accent">&gt;</span>
      What will you build today?
      <span class="cursor-blink">_</span>
    </h1>

    <!-- Main AI buttons grid -->
    <div class="ai-grid">
      <a href="https://claude.ai/new" target="_self" class="ai-card claude">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3L14 9L20 12L14 15L12 21L10 15L4 12L10 9L12 3Z" fill="currentColor"/>
            </svg>
          </div>
          <span class="card-name">Claude</span>
          <span class="card-desc">Thinking partner</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://chat.openai.com" target="_self" class="ai-card chatgpt">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15v-4H7l5-8v4h4l-5 8z" fill="currentColor"/>
            </svg>
          </div>
          <span class="card-name">ChatGPT</span>
          <span class="card-desc">GPT models</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://gemini.google.com" target="_self" class="ai-card gemini">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L15 8.5L22 12L15 15.5L12 22L9 15.5L2 12L9 8.5L12 2Z" fill="currentColor"/>
              <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1"/>
            </svg>
          </div>
          <span class="card-name">Gemini</span>
          <span class="card-desc">Google AI</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://grok.com" target="_self" class="ai-card grok">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 4L12 20L20 4" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M20 20L14 10" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="card-name">Grok</span>
          <span class="card-desc">xAI</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://claude.ai/design/" target="_self" class="ai-card claude-design">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="18" height="18" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 16L12 6L16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M9.5 13h5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="18" cy="18" r="4" fill="#050505" stroke="currentColor" stroke-width="1.5"/>
              <path d="M16.5 18L17.5 16.5L18.5 18L19.5 17" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          <span class="card-name">Claude Design</span>
          <span class="card-desc">Visual builder</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://lovable.dev" target="_self" class="ai-card lovable">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/>
            </svg>
          </div>
          <span class="card-name">Lovable</span>
          <span class="card-desc">App builder</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://anthropic.skilljar.com/" target="_self" class="ai-card courses">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M9 7h6M9 11h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="card-name">Courses</span>
          <span class="card-desc">Anthropic Academy</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://muse.ai" target="_self" class="ai-card muse">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 9l5 3-5 3V9z" fill="currentColor"/>
            </svg>
          </div>
          <span class="card-name">Muse</span>
          <span class="card-desc">AI video</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>

      <a href="https://www.google.com" target="_self" class="ai-card google">
        <div class="card-glow"></div>
        <div class="card-border"></div>
        <div class="card-content">
          <div class="card-icon">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
              <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="card-name">Google</span>
          <span class="card-desc">Search</span>
        </div>
        <div class="corner-marks">
          <span class="corner tl"></span><span class="corner tr"></span>
          <span class="corner bl"></span><span class="corner br"></span>
        </div>
      </a>
    </div>

    <!-- Expand button for more tools -->
    <button id="more-tools-btn" class="more-tools-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      MORE_TOOLS
    </button>

    <div id="extra-tools" class="extra-tools hidden">
      <div class="extra-grid">
        <a href="https://v0.dev" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="18" height="18" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M8 16l4-10 4 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span>v0</span>
        </a>
        <a href="https://www.perplexity.ai" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M15.5 15.5L20 20" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M11 8v6M8 11h6" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          </span>
          <span>Perplexity</span>
        </a>
        <a href="https://colab.research.google.com" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16v12H4z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><path d="M8 10l3 3-3 3M13 15h3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
          <span>Colab</span>
        </a>
        <a href="https://sana.ai" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </span>
          <span>Sana</span>
        </a>
        <a href="https://www.anthropic.com" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 3L14 9L20 12L14 15L12 21L10 15L4 12L10 9L12 3Z" stroke="currentColor" stroke-width="1.5" fill="none"/></svg>
          </span>
          <span>Anthropic</span>
        </a>
        <a href="https://www.openai.com" target="_self" class="extra-btn">
          <span class="extra-icon">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.5"/><path d="M12 7v5l3.5 3.5" stroke="currentColor" stroke-width="1" stroke-linecap="round"/><circle cx="12" cy="12" r="2" fill="currentColor"/></svg>
          </span>
          <span>OpenAI</span>
        </a>
      </div>
    </div>
  </div>

  <script src="newtab.js"></script>
</body>
</html>
